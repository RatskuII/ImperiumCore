name: ImperiumCore
version: '${project.version}'
main: dev.RatFjc.ImperiumCore.ImperiumCore
api-version: '1.21'
prefix: ImperiumCore
authors: [ Fjc, Rat ]
description: The one stop core for all odd and sod. Imperium hook and fix plugin

softdepend:
  - ODailyQuests
  - LuckPerms
  - Train_Carts

commands:
  core-reload:
    description: Command portal to reload available configurations.
  nv:
    description: Toggles night vision
    usage: /nv [on/off]
  allow-experiments:
    description: Allow certain experimental features to occur
    usage: /allow-experiments [allow/deny]
  god:
    description: Allows invincibility
    usage: /god
  ungod:
    description: Removes invincibility
    usage: /ungod
  pet-exchanger:
    description: Allows you to exchange old pets for currency
    usage: /pet-exchanger
  frame:
    description: Give invisible frames to a player
    usage: /frame <player> <amount> [glow]
  pw:
    description: Allows you to teleport to and manage player warps.
    usage: /pw [name] | /pw create [name] | /pw reset [name] | /pw remove [name]
  mail:
    aliases: [ mailbox, send, gift, rewards, reward ]
    description: Player mailbox and mail-sending commands.
    usage: /mail
  adminmail:
    aliases: [ adminmailbox, adminsend, admingift, adminrewards, adminreward ]
    description: Admin reward + mailbox management commands.
    usage: /adminmail
  route-lookup:
    description: Allows you to lookup destinations present on a route.
    usage: /route-lookup <routeName>
  friend:
    description: Allows you to manage friends.
    usage: /friend <operator> <target>

permissions:
  imperium.mail.player:
    default: true

  imperium.mail.reminder:
    description: Enables mailbox reminder notifications
    default: true

  imperium.mail.admin:
    default: op

  imperium.afk.immunity:
    description: Provides immunity to being afk kicked
    default: op